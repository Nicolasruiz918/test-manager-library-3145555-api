name: manager-library-tests
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: manager_library_test
      POSTGRES_USER: library_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set an ephemeral TEST_DB_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_test -d manager_library_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: manager-library-api:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: testing
      DB_HOST: db
      DB_DATABASE: manager_library_test
      DB_USERNAME: library_test
      DB_PASSWORD: ${TEST_DB_PASSWORD:?Set an ephemeral TEST_DB_PASSWORD}
    command: ["composer", "test"]
